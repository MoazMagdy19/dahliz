<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>DAHLIZ</title>
<style>
  /* Layout: one centered column. A tall rounded stage holds the fluid, a control card sits under it, then the concept note and disclaimer. */
  :root {
    color-scheme: dark;
    --bg: #050a14;
    --stage-a: #0b1830;
    --stage-b: #060d1b;
    --panel: #0a1322;
    --panel-2: #0f1b2f;
    --line: #17263d;
    --fg: #d6e4f0;
    --muted: #7f95ad;
    --cyan: #5fe3e0;
    --cyan-soft: rgba(95, 227, 224, 0.12);
    --cyan-line: rgba(95, 227, 224, 0.38);
    --warn: #e2b765;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Tahoma, Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.55 var(--sans);
    padding-block: 22px 40px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    -webkit-text-size-adjust: 100%;
  }
  .wrap { width: 100%; max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

  header { text-align: center; padding-block: 4px 2px; }
  h1 {
    margin: 0;
    font-size: clamp(26px, 5vw, 34px);
    font-weight: 300;
    letter-spacing: 0.42em;
    padding-left: 0.42em;
    color: var(--fg);
  }
  .sub { margin: 6px 0 0; color: var(--muted); font-size: 14px; text-wrap: balance; }

  .stage {
    position: relative;
    height: clamp(340px, 62vh, 560px);
    border-radius: 28px;
    border: 1px solid var(--line);
    background: radial-gradient(ellipse at 50% 45%, var(--stage-a) 0%, var(--stage-b) 72%);
    overflow: hidden;
  }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .tag {
    position: absolute; top: 16px; inset-inline-start: 18px;
    font: 11px/1 var(--mono); letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--muted); opacity: 0.8;
  }
  .msg {
    position: absolute; left: 50%; bottom: 18px;
    transform: translateX(-50%);
    max-width: calc(100% - 32px);
    padding: 9px 18px; border-radius: 999px;
    background: rgba(10, 19, 34, 0.82);
    border: 1px solid var(--line);
    color: var(--fg); font-size: 14px; text-align: center;
    opacity: 0; transition: opacity 0.6s ease; pointer-events: none;
  }
  .msg.on { opacity: 1; }

  .gate {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 24px; text-align: center;
    background: rgba(5, 10, 20, 0.62);
    transition: opacity 0.5s ease;
  }
  .gate[hidden] { display: none; }
  .gate p { margin: 0; max-width: 34ch; color: var(--muted); font-size: 14px; text-wrap: balance; }

  button {
    font: inherit; color: var(--fg); cursor: pointer;
    min-height: 44px; padding: 8px 16px;
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 14px;
    transition: background 0.25s ease, border-color 0.25s ease, color 0.25s ease;
  }
  button:hover { border-color: var(--cyan-line); }
  button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
  button.primary { background: var(--cyan-soft); border-color: var(--cyan-line); color: var(--cyan); padding-inline: 34px; }
  button.link { background: none; border: none; min-height: 36px; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }
  button[aria-pressed="true"] { background: var(--cyan-soft); border-color: var(--cyan-line); color: var(--cyan); }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 22px; padding: 18px; }
  .controls { display: flex; flex-direction: column; gap: 18px; }
  .label { font: 11px/1 var(--mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }

  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 5px; background: var(--bg); border: 1px solid var(--line); border-radius: 16px; }
  .seg button { border: none; background: transparent; border-radius: 12px; letter-spacing: 0.12em; font-weight: 600; font-size: 13px; }
  .seg button[aria-pressed="true"] { background: var(--cyan-soft); color: var(--cyan); box-shadow: inset 0 0 0 1px var(--cyan-line); }
  .seg-note { margin: 8px 2px 0; color: var(--muted); font-size: 13px; }

  dl.status { margin: 0; display: grid; gap: 0; }
  dl.status > div { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 10px 0; border-top: 1px solid var(--line); }
  dl.status > div:first-child { border-top: none; padding-top: 0; }
  dt { color: var(--muted); font-size: 14px; }
  dd { margin: 0; display: flex; align-items: center; gap: 8px; text-align: end; min-width: 0; font-size: 14px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--muted); opacity: 0.6; }
  .dot[data-s="ok"] { background: var(--cyan); opacity: 1; box-shadow: 0 0 8px rgba(95, 227, 224, 0.5); }
  .dot[data-s="warn"] { background: var(--warn); opacity: 1; }

  .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; direction: ltr; }
  .pad button { padding-inline: 6px; font-size: 14px; white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  .pad .up { grid-column: 2; grid-row: 1; }
  .pad .left { grid-column: 1; grid-row: 2; }
  .pad .stop { grid-column: 2; grid-row: 2; color: var(--muted); }
  .pad .right { grid-column: 3; grid-row: 2; }
  .pad .down { grid-column: 2; grid-row: 3; }

  .info h2 { margin: 0; font-size: 17px; font-weight: 600; }
  .info-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 10px; }
  .badge { font: 11px/1 var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--warn); border: 1px solid rgba(226, 183, 101, 0.4); border-radius: 999px; padding: 5px 10px; }
  .info p { margin: 0; color: var(--fg); max-width: 62ch; }
  .info p + p { margin-top: 10px; color: var(--muted); font-size: 14px; }

  .disclaimer { margin: 0; padding: 0 6px; color: var(--muted); font-size: 12.5px; line-height: 1.6; text-align: center; max-width: 62ch; align-self: center; }

  .toolbar { display: flex; justify-content: flex-end; margin-bottom: -6px; }
  button.lang { min-height: 36px; padding: 4px 14px; font-size: 13px; border-radius: 999px; color: var(--muted); }
  [lang="ar"] .label, [lang="ar"] .badge, [lang="ar"] .tag, [lang="ar"] .seg button {
    letter-spacing: 0; text-transform: none; font-family: var(--sans);
  }
  [lang="ar"] .label { font-size: 13px; }
  [lang="ar"] .badge, [lang="ar"] .tag { font-size: 12px; }
  [lang="ar"] .seg button { font-size: 14px; }
  [lang="ar"] body { line-height: 1.7; }

  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>
<main class="wrap">
  <div class="toolbar"><button type="button" class="lang" id="langBtn"></button></div>
  <header>
    <h1>DAHLIZ</h1>
    <p class="sub" data-i18n="sub"></p>
  </header>

  <section class="stage" id="stage" data-i18n-aria="stageLabel">
    <canvas id="fluid" aria-hidden="true"></canvas>
    <span class="tag" data-i18n="tag"></span>
    <div class="msg" id="msg" role="status" aria-live="polite"></div>
    <div class="gate" id="gate">
      <p data-i18n="gateText"></p>
      <button class="primary" id="begin" type="button" data-i18n="begin"></button>
      <button class="link" id="beginManual" type="button" data-i18n="beginManual"></button>
    </div>
  </section>

  <section class="card controls" data-i18n-aria="controlsLabel">
    <div>
      <p class="label" data-i18n="modeLabel"></p>
      <div class="seg" role="group" data-i18n-aria="modeGroup">
        <button type="button" id="modeLOW" data-mode="LOW" data-i18n="modeLOW" aria-pressed="true"></button>
        <button type="button" id="modeMED" data-mode="MED" data-i18n="modeMED" aria-pressed="false"></button>
      </div>
      <p class="seg-note" id="modeNote"></p>
    </div>

    <dl class="status" aria-live="polite">
      <div><dt data-i18n="stModeLabel"></dt><dd><span id="stMode"></span></dd></div>
      <div><dt data-i18n="stSensorLabel"></dt><dd><span class="dot" id="sensorDot" data-s="idle"></span><span id="stSensor"></span></dd></div>
      <div><dt data-i18n="stCalLabel"></dt><dd><span class="dot" id="calDot" data-s="idle"></span><span id="stCal"></span></dd></div>
    </dl>

    <button type="button" id="reset" data-i18n="reset"></button>

    <div>
      <p class="label" data-i18n="manualLabel"></p>
      <div class="pad" role="group" data-i18n-aria="manualGroup">
        <button type="button" class="up" data-dir="up" aria-pressed="false"><span class="arrow" aria-hidden="true">&uarr;</span><span data-i18n="up"></span></button>
        <button type="button" class="left" data-dir="left" aria-pressed="false"><span class="arrow" aria-hidden="true">&larr;</span><span data-i18n="left"></span></button>
        <button type="button" class="stop" data-dir="stop" data-i18n="stop"></button>
        <button type="button" class="right" data-dir="right" aria-pressed="false"><span class="arrow" aria-hidden="true">&rarr;</span><span data-i18n="right"></span></button>
        <button type="button" class="down" data-dir="down" aria-pressed="false"><span class="arrow" aria-hidden="true">&darr;</span><span data-i18n="down"></span></button>
      </div>
      <p class="seg-note" data-i18n="manualNote"></p>
    </div>
  </section>

  <section class="card info">
    <div class="info-head">
      <h2 data-i18n="infoTitle"></h2>
      <span class="badge" data-i18n="badge"></span>
    </div>
    <p data-i18n="info1"></p>
    <p data-i18n="info2"></p>
  </section>

  <p class="disclaimer" data-i18n="disclaimer"></p>
</main>

<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const TAU = Math.PI * 2;
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const IOS = /iP(hone|od|ad)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  /* ---------- Motion modes ----------
     amp    how far the fluid shifts at full input (fraction of the stage)
     tau    seconds the input is smoothed over (low-pass filter)
     k      spring stiffness of each particle
     zeta   damping ratio (below 1 gives a soft, slightly wobbly settle)
     ripple size of the slow wave moving through the particles */
  const MODES = {
    LOW: { amp: 0.20, tau: 0.75, k: 4.5, zeta: 0.60, ripple: 0.011 },
    MED: { amp: 0.32, tau: 0.40, k: 9.5, zeta: 0.72, ripple: 0.007 }
  };
  let modeName = 'LOW';

  /* ---------- Languages ---------- */
  const I18N = {
    en: {
      sub: 'Stabilize your screen, not your senses.',
      tag: 'Simulated endolymph',
      stageLabel: 'Simulated vestibular fluid',
      gateText: 'Motion sensors move the particles opposite to your own movement.',
      begin: 'Begin',
      beginManual: 'Use manual simulation instead',
      controlsLabel: 'Controls',
      modeLabel: 'Motion mode',
      modeGroup: 'Motion mode',
      modeLOW: 'LOW', modeMED: 'MED',
      noteLOW: 'Slower, softer response with a slight ripple.',
      noteMED: 'Medium movement. Still smooth and comfortable.',
      stModeLabel: 'Current mode',
      stSensorLabel: 'Sensor status',
      stCalLabel: 'Calibration',
      notStarted: 'Not started',
      st_active: 'Active',
      st_wait: 'Waiting for sensors…',
      st_manual: 'Manual simulation',
      st_na: 'Not available. Use manual simulation.',
      st_https: 'Needs HTTPS. Use manual simulation.',
      st_denied: 'Permission denied. Use manual simulation.',
      st_needed: 'Permission needed. Use manual simulation.',
      cal_run: 'Calibrating…',
      cal_done: 'Calibrated',
      msg_hold: 'Hold your device normally',
      msg_ready: 'DAHLIZ is ready',
      reset: 'Reset Orientation',
      manualLabel: 'Manual simulation',
      manualGroup: 'Manual simulation controls',
      up: 'Move Up', left: 'Move Left', stop: 'Stop', right: 'Move Right', down: 'Move Down',
      manualNote: 'Simulates your body moving in that direction. The particles drift the other way until you press Stop.',
      infoTitle: 'How DAHLIZ Works',
      badge: 'Prototype concept',
      info1: 'During movement, your visual system and vestibular system can receive different signals. DAHLIZ creates a calm visual reference by displaying particles that move opposite to your detected body/device motion.',
      info2: 'This is a prototype concept, not a medical treatment.',
      disclaimer: 'DAHLIZ is an experimental prototype for visual motion simulation. It is not a medical device, does not diagnose or treat motion sickness, and should not be used as a substitute for medical advice.',
      langOther: 'العربية',
      langAria: 'Switch to Arabic'
    },
    ar: {
      sub: 'ثبّت شاشتك، لا حواسّك.',
      tag: 'محاكاة اللمف الباطن',
      stageLabel: 'محاكاة سائل الجهاز الدهليزي',
      gateText: 'تحرّك حساسات الجهاز الجسيمات في عكس اتجاه حركتك.',
      begin: 'ابدأ',
      beginManual: 'استخدم المحاكاة اليدوية بدلًا من ذلك',
      controlsLabel: 'عناصر التحكم',
      modeLabel: 'وضع الحركة',
      modeGroup: 'وضع الحركة',
      modeLOW: 'منخفض', modeMED: 'متوسط',
      noteLOW: 'استجابة أبطأ وأنعم مع تموّج خفيف.',
      noteMED: 'حركة متوسطة، لا تزال سلسة ومريحة.',
      stModeLabel: 'الوضع الحالي',
      stSensorLabel: 'حالة الحساسات',
      stCalLabel: 'المعايرة',
      notStarted: 'لم تبدأ بعد',
      st_active: 'تعمل',
      st_wait: 'بانتظار الحساسات…',
      st_manual: 'محاكاة يدوية',
      st_na: 'غير متاحة. استخدم المحاكاة اليدوية.',
      st_https: 'تتطلب HTTPS. استخدم المحاكاة اليدوية.',
      st_denied: 'تم رفض الإذن. استخدم المحاكاة اليدوية.',
      st_needed: 'الإذن مطلوب. استخدم المحاكاة اليدوية.',
      cal_run: 'جارٍ المعايرة…',
      cal_done: 'تمت المعايرة',
      msg_hold: 'أمسك جهازك بالطريقة المعتادة',
      msg_ready: 'DAHLIZ جاهز',
      reset: 'إعادة ضبط الاتجاه',
      manualLabel: 'المحاكاة اليدوية',
      manualGroup: 'أزرار المحاكاة اليدوية',
      up: 'تحريك للأعلى', left: 'تحريك لليسار', stop: 'إيقاف', right: 'تحريك لليمين', down: 'تحريك للأسفل',
      manualNote: 'تحاكي حركة جسمك في هذا الاتجاه. تنجرف الجسيمات في الاتجاه المعاكس حتى تضغط «إيقاف».',
      infoTitle: 'كيف يعمل DAHLIZ',
      badge: 'مفهوم تجريبي',
      info1: 'أثناء الحركة، قد يستقبل نظامك البصري ونظامك الدهليزي إشارات مختلفة. يوفّر DAHLIZ مرجعًا بصريًا هادئًا بعرض جسيمات تتحرك عكس حركة جسمك أو جهازك المرصودة.',
      info2: 'هذا مفهوم تجريبي (نموذج أولي) وليس علاجًا طبيًا.',
      disclaimer: 'DAHLIZ نموذج تجريبي للمحاكاة البصرية للحركة. وهو ليس جهازًا طبيًا، ولا يشخّص دوار الحركة ولا يعالجه، ولا يغني عن استشارة طبية.',
      langOther: 'English',
      langAria: 'التبديل إلى الإنجليزية'
    }
  };
  let lang = 'en';
  const t = (k) => (I18N[lang] && I18N[lang][k]) || I18N.en[k] || k;

  /* ---------- Elements ---------- */
  const stage = $('stage'), canvas = $('fluid'), ctx = canvas.getContext('2d');
  const gate = $('gate'), msg = $('msg');
  const stMode = $('stMode'), stSensor = $('stSensor'), stCal = $('stCal');
  const sensorDot = $('sensorDot'), calDot = $('calDot'), langBtn = $('langBtn');

  /* ---------- Particles (positions are fractions of the stage, 0..1) ---------- */
  const N = 16;
  const particles = [];
  for (let i = 0; i < N; i++) {
    const a = i * 2.39996323;                 // golden angle spreads dots evenly
    const r = Math.sqrt((i + 0.5) / N);
    const hx = 0.5 + Math.cos(a) * r * 0.30;
    const hy = 0.5 + Math.sin(a) * r * 0.30;
    particles.push({
      hx, hy, x: hx, y: hy, vx: 0, vy: 0,
      depth: 0.55 + Math.random() * 0.45,     // deeper particles travel further
      size: 0.7 + Math.random() * 0.9,
      ks: 0.75 + Math.random() * 0.5,         // each one has its own stiffness
      lag: Math.random() * 0.9,               // and its own response delay
      phase: Math.random() * TAU,
      f: 0.18 + Math.random() * 0.22,
      ix: 0, iy: 0
    });
  }

  /* ---------- Input state ----------
     tx, ty: wanted body motion, -1..1 (x: right is +, y: up is +)
     ix, iy: smoothed motion the fluid reacts to */
  let tx = 0, ty = 0, ix = 0, iy = 0;
  let manualDir = [0, 0];

  /* ---------- Sensors ---------- */
  let started = false, sensorOn = false, sensorGot = false;
  let calibrating = false, calibrated = false, base = null, calSum = null;
  const orient = { g: null, b: null };
  const acc = [0, 0];
  let grav = null;

  let sensorKey = 'notStarted', calKey = 'notStarted', msgKey = null;
  const setSensor = (key, state) => { sensorKey = key; stSensor.textContent = t(key); sensorDot.dataset.s = state; };
  const setCal = (key, state) => { calKey = key; stCal.textContent = t(key); calDot.dataset.s = state; };

  let msgTimer;
  function say(key, hold) {
    msgKey = key;
    msg.textContent = t(key);
    msg.classList.add('on');
    clearTimeout(msgTimer);
    if (!hold) msgTimer = setTimeout(() => msg.classList.remove('on'), 2400);
  }

  function screenAngle() {
    if (screen.orientation && typeof screen.orientation.angle === 'number') return screen.orientation.angle;
    return typeof window.orientation === 'number' ? ((window.orientation % 360) + 360) % 360 : 0;
  }
  // device axes (x right, y up in portrait) to what the person sees (right, up)
  function toScreen(dx, dy) {
    switch (screenAngle()) {
      case 90: return [-dy, dx];
      case 180: return [-dx, -dy];
      case 270: return [dy, -dx];
      default: return [dx, dy];
    }
  }

  function markSensor() {
    if (sensorGot) return;
    sensorGot = true;
    setSensor('st_active', 'ok');
  }
  function onOrientation(e) {
    if (e.gamma == null || e.beta == null) return;
    orient.g = e.gamma; orient.b = e.beta;
    if (calibrating && calSum) { calSum.g += e.gamma; calSum.b += e.beta; calSum.n++; }
    markSensor();
  }
  function onMotion(e) {
    let a = e.acceleration, lin;
    if (a && a.x != null && a.y != null) {
      lin = [a.x, a.y];
    } else {
      a = e.accelerationIncludingGravity;
      if (!a || a.x == null || a.y == null) return;
      const s = IOS ? -1 : 1;                 // iOS reports this axis inverted
      const ax = a.x * s, ay = a.y * s;
      if (!grav) grav = [ax, ay];
      grav[0] += (ax - grav[0]) * 0.02;       // slow estimate of gravity, removed below
      grav[1] += (ay - grav[1]) * 0.02;
      lin = [ax - grav[0], ay - grav[1]];
    }
    acc[0] += (lin[0] - acc[0]) * 0.2;        // low-pass so the dots never shake
    acc[1] += (lin[1] - acc[1]) * 0.2;
    markSensor();
  }

  function noSensors(key) {
    sensorOn = false;
    setSensor(key || 'st_na', 'warn');
  }

  async function startSensors() {
    const DME = window.DeviceMotionEvent, DOE = window.DeviceOrientationEvent;
    if (!DME && !DOE) return noSensors();
    if (window.isSecureContext === false) return noSensors('st_https');
    try {
      const asker = (DME && typeof DME.requestPermission === 'function') ? DME
        : (DOE && typeof DOE.requestPermission === 'function') ? DOE : null;
      if (asker) {
        const res = await asker.requestPermission();
        if (res !== 'granted') return noSensors('st_denied');
      }
    } catch (err) {
      return noSensors('st_needed');
    }
    sensorOn = true;
    window.addEventListener('devicemotion', onMotion);
    window.addEventListener('deviceorientation', onOrientation);
    setSensor('st_wait', 'idle');
    setTimeout(() => { if (!sensorGot) noSensors(); }, 2000);
  }

  /* ---------- Calibration ---------- */
  function beginCalibration() {
    calibrating = true;
    calSum = { g: 0, b: 0, n: 0 };
    setCal('cal_run', 'idle');
    say('msg_hold', true);
    setTimeout(finishCalibration, 1000);
  }
  function finishCalibration() {
    calibrating = false;
    calibrated = true;
    if (calSum && calSum.n > 0) base = { g: calSum.g / calSum.n, b: calSum.b / calSum.n };
    else if (orient.g != null) base = { g: orient.g, b: orient.b };
    else base = null;
    setCal('cal_done', 'ok');
    say('msg_ready');
  }

  function startExperience(useSensors) {
    if (started) return;
    started = true;
    gate.hidden = true;
    if (useSensors) { startSensors(); }
    else { setSensor('st_manual', 'idle'); }
    beginCalibration();
  }

  /* ---------- Turning sensor readings into wanted motion ---------- */
  function updateTarget(dt) {
    if (calibrating) { tx = 0; ty = 0; return; }
    if (manualDir[0] || manualDir[1]) { tx = manualDir[0]; ty = manualDir[1]; return; }
    if (sensorOn && sensorGot) {
      if (!base && orient.g != null) base = { g: orient.g, b: orient.b };
      let tilt = [0, 0];
      if (base && orient.g != null) {
        base.g += (orient.g - base.g) * (1 - Math.exp(-dt / 12));   // slow re-centering so a held tilt fades
        base.b += (orient.b - base.b) * (1 - Math.exp(-dt / 12));
        tilt = toScreen((orient.g - base.g) / 22, (orient.b - base.b) / 22);
      }
      const push = toScreen(acc[0] / 3, acc[1] / 3);
      tx = clamp(tilt[0] * 0.9 + push[0] * 0.7, -1, 1);
      ty = clamp(tilt[1] * 0.9 + push[1] * 0.7, -1, 1);
      return;
    }
    tx = 0; ty = 0;
  }

  /* ---------- Fluid simulation ---------- */
  let W = 0, H = 0, dpr = 1;

  // eases a value into [lo, hi] without ever reaching the edge
  function soft(v, lo, hi) {
    const s = (hi - lo) * 0.14;
    if (v < lo + s) return lo + s - s * (1 - Math.exp(-((lo + s) - v) / s));
    if (v > hi - s) return hi - s + s * (1 - Math.exp(-(v - (hi - s)) / s));
    return v;
  }
  const baseRadius = () => clamp(Math.min(W, H) * 0.022, 5, 13);

  function step(dt, t) {
    const m = MODES[modeName];
    const a = 1 - Math.exp(-dt / m.tau);
    ix += (tx - ix) * a;
    iy += (ty - iy) * a;
    const motion = Math.min(1, Math.hypot(ix, iy));
    const rip = reduceMotion ? 0 : m.ripple * (1 + 1.6 * motion);
    const br = baseRadius();

    for (const p of particles) {
      const pa = 1 - Math.exp(-dt / (m.tau * (0.3 + p.lag)));       // each dot reacts a little later
      p.ix += (ix - p.ix) * pa;
      p.iy += (iy - p.iy) * pa;

      const wx = Math.sin(t * p.f * TAU + p.phase + p.hx * 6) * rip;
      const wy = Math.cos(t * p.f * TAU * 0.83 + p.phase * 1.3 + p.hy * 6) * rip;

      const r = br * p.size;
      const mx = (r * 1.3 + 12) / Math.max(W, 1);
      const my = (r * 1.3 + 12) / Math.max(H, 1);
      const gx = soft(p.hx - p.ix * m.amp * p.depth + wx, mx, 1 - mx);   // body right: fluid goes left
      const gy = soft(p.hy + p.iy * m.amp * p.depth + wy, my, 1 - my);   // body up: fluid goes down

      const k = m.k * p.ks, c = 2 * m.zeta * Math.sqrt(k);
      p.vx += ((gx - p.x) * k - c * p.vx) * dt;
      p.vy += ((gy - p.y) * k - c * p.vy) * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;

      if (p.x < mx) { p.x = mx; p.vx = 0; } else if (p.x > 1 - mx) { p.x = 1 - mx; p.vx = 0; }
      if (p.y < my) { p.y = my; p.vy = 0; } else if (p.y > 1 - my) { p.y = 1 - my; p.vy = 0; }
    }
  }

  function draw(t) {
    ctx.clearRect(0, 0, W, H);
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(95,227,224,0.06)';
    ctx.beginPath();
    ctx.arc(W / 2, H / 2, Math.min(W, H) * 0.31, 0, TAU);
    ctx.stroke();

    const br = baseRadius();
    for (const p of particles) {
      const px = p.x * W, py = p.y * H;
      const r = br * p.size, R = r * 2.6;
      const al = 0.42 + 0.08 * Math.sin(t * 0.6 + p.phase);
      const g = ctx.createRadialGradient(px, py, 0, px, py, R);
      g.addColorStop(0, 'rgba(130,238,235,' + al.toFixed(3) + ')');
      g.addColorStop(0.36, 'rgba(95,227,224,' + (al * 0.7).toFixed(3) + ')');
      g.addColorStop(0.42, 'rgba(95,227,224,' + (al * 0.4).toFixed(3) + ')');
      g.addColorStop(1, 'rgba(95,227,224,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(px, py, R, 0, TAU);
      ctx.fill();
    }
  }

  function resize() {
    const w = stage.clientWidth, h = stage.clientHeight;
    const d = Math.min(window.devicePixelRatio || 1, 2);
    if (w === W && h === H && d === dpr) return;
    W = w; H = h; dpr = d;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  let last = performance.now(), clock = 0;
  function frame(now) {
    const dt = Math.min(0.033, Math.max(0.001, (now - last) / 1000));
    last = now; clock += dt;
    resize();
    updateTarget(dt);
    step(dt, clock);
    draw(clock);
    requestAnimationFrame(frame);
  }

  /* ---------- Controls ---------- */
  function setMode(name) {
    modeName = name;
    stMode.textContent = t('mode' + name);
    $('modeNote').textContent = t('note' + name);
    document.querySelectorAll('[data-mode]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.mode === name)));
  }
  document.querySelectorAll('[data-mode]').forEach((b) => b.addEventListener('click', () => setMode(b.dataset.mode)));

  const DIRS = { left: [-1, 0], right: [1, 0], up: [0, 1], down: [0, -1], stop: [0, 0] };
  document.querySelectorAll('[data-dir]').forEach((b) => {
    b.addEventListener('click', () => {
      if (!started) startExperience(false);
      manualDir = DIRS[b.dataset.dir];
      document.querySelectorAll('[data-dir]').forEach((o) => {
        if (o.dataset.dir !== 'stop') o.setAttribute('aria-pressed', String(o === b));
      });
    });
  });

  $('begin').addEventListener('click', () => startExperience(true));
  $('beginManual').addEventListener('click', () => startExperience(false));
  $('reset').addEventListener('click', () => {
    if (!started) { startExperience(false); return; }
    if (!calibrating) beginCalibration();
  });

  function applyLang(l) {
    lang = l;
    const root = document.documentElement;
    root.lang = l;
    root.dir = l === 'ar' ? 'rtl' : 'ltr';
    document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll('[data-i18n-aria]').forEach((el) => el.setAttribute('aria-label', t(el.dataset.i18nAria)));
    stSensor.textContent = t(sensorKey);
    stCal.textContent = t(calKey);
    if (msgKey) msg.textContent = t(msgKey);
    setMode(modeName);
    langBtn.textContent = t('langOther');
    langBtn.setAttribute('lang', l === 'ar' ? 'en' : 'ar');
    langBtn.setAttribute('aria-label', t('langAria'));
    try { localStorage.setItem('dahliz-lang', l); } catch (e) { /* storage may be blocked */ }
  }
  langBtn.addEventListener('click', () => applyLang(lang === 'ar' ? 'en' : 'ar'));

  let startLang = 'en';
  try {
    const saved = localStorage.getItem('dahliz-lang');
    if (saved === 'ar' || saved === 'en') startLang = saved;
    else if (/^ar/i.test(navigator.language || '')) startLang = 'ar';
  } catch (e) {
    if (/^ar/i.test(navigator.language || '')) startLang = 'ar';
  }

  setSensor('notStarted', 'idle');
  setCal('notStarted', 'idle');
  applyLang(startLang);
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
